name: Publish to npm

# Releases ship only from GitHub Actions: bump the version and push a `v*` tag.
# `prepublishOnly` blocks local `npm publish`, so this workflow is the only path.
# Both triggers (tag push and manual dispatch) pass through the SAME version guard below.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish. Must match package.json exactly, e.g. 0.3.5'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Manual releases must come from main. This runs before anything is installed or
      # published, so a dispatch from another ref fails explicitly at the very start.
      # Tag pushes are untouched: the tag's own commit is what gets published.
      - name: Restrict manual dispatch to main
        if: github.event_name == 'workflow_dispatch'
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$DISPATCH_REF" != "refs/heads/main" ]; then
            echo "Manual publish is only allowed from refs/heads/main, got $DISPATCH_REF" >&2
            exit 1
          fi
          echo "Manual dispatch confirmed on main"

      # One guard for both triggers. It re-checks the dispatch branch (defense in depth),
      # keeps the tag/input-to-package.json agreement and SemVer check, and replaces the old
      # CLI probe: a 404 allows, a 200 blocks, and ANY other answer (timeout, 5xx,
      # auth error, socket failure) blocks too. A registry outage never skips this check.
      - name: Verify release version and npm availability
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: node scripts/verify-release.mjs

      - name: Use npm with Trusted Publishing support
        run: npm install -g npm@latest

      - name: Remove deprecated always-auth setting
        run: npm config delete always-auth || true

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      # No NODE_AUTH_TOKEN: npm exchanges the GitHub OIDC token for a
      # short-lived publish credential. Requires the Trusted Publisher
      # entry on npmjs.com for meiyx7/opencode-plugin-hub/publish.yml.
      - name: Publish
        run: npm publish --access public --provenance
