name: Publish to npm

# Releases ship only from GitHub Actions: bump the version and push a `v*` tag.
# `prepublishOnly` blocks local `npm publish`, so this workflow is the only path.
# Both triggers (tag push and manual dispatch) pass through the SAME version guard below.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish. Must match package.json exactly, e.g. 0.3.5'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # One guard for both triggers. A manual run has no tag, so it must state the version
      # explicitly; an empty input is a failure, never a reason to skip the check.
      - name: Verify release version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            expected="${GITHUB_REF_NAME#v}"
            source="tag $GITHUB_REF_NAME"
          else
            expected="$INPUT_VERSION"
            source="workflow_dispatch input"
          fi
          if [ -z "$expected" ]; then
            echo "No release version supplied ($source); a manual run needs the version input" >&2
            exit 1
          fi
          if ! printf '%s' "$expected" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "Invalid version '$expected' from $source" >&2
            exit 1
          fi
          version="$(node -p "require('./package.json').version")"
          if [ "$expected" != "$version" ]; then
            echo "$source says $expected but package.json is $version" >&2
            exit 1
          fi
          # Both triggers also refuse to republish a version that is already on npm. A registry
          # lookup failure is not fatal: npm publish itself still rejects a duplicate version.
          name="$(node -p "require('./package.json').name")"
          if published="$(npm view "$name@$expected" version --registry=https://registry.npmjs.org/ 2>/dev/null)"; then
            echo "Version $expected is already published ($published)" >&2
            exit 1
          fi
          echo "Release version verified: $expected (from $source)"

      - name: Use npm with Trusted Publishing support
        run: npm install -g npm@latest

      - name: Remove deprecated always-auth setting
        run: npm config delete always-auth || true

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      # No NODE_AUTH_TOKEN: npm exchanges the GitHub OIDC token for a
      # short-lived publish credential. Requires the Trusted Publisher
      # entry on npmjs.com for meiyx7/opencode-plugin-hub/publish.yml.
      - name: Publish
        run: npm publish --access public --provenance
