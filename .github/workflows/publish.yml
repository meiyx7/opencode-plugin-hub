name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Use npm with Trusted Publishing support
        run: npm install -g npm@latest

      - name: Remove deprecated always-auth setting
        run: npm config delete always-auth || true

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # No NODE_AUTH_TOKEN: npm exchanges the GitHub OIDC token for a
      # short-lived publish credential. Requires the Trusted Publisher
      # entry on npmjs.com for meiyx7/opencode-plugin-hub/publish.yml.
      - name: Publish
        run: npm publish --access public --provenance
