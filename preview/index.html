<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>插件中心 · 实装预览</title>
<style>
  html, body { margin: 0; min-height: 100%; }
  body {
    background: #f4f5f7;
    color: #161616;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
    --color-v2-text-text-contrast: #161616;
    --color-v2-text-text-base: #262626;
    --color-v2-text-text-muted: #5c5c5c;
    --color-v2-text-text-faint: #8f8f8f;
    --color-v2-border-border-base: rgba(0, 0, 0, 0.10);
    --color-v2-border-border-strong: rgba(0, 0, 0, 0.22);
    --color-v2-background-bg-base: #ffffff;
    --color-v2-background-bg-layer-01: #fafafa;
    --color-v2-background-bg-layer-02: #f0f0f0;
    --color-v2-background-bg-layer-03: #e8e8e8;
    --color-v2-text-text-accent: #5a5fe0;
    --color-blue-primary: #5a5fe0;
    --color-v2-state-fg-success: #1f7a44;
    --color-v2-state-fg-danger: #c23b34;
    --color-v2-state-fg-warning: #a86e10;
    --color-v2-overlay-simple-overlay-hover: rgba(0,0,0,0.06);
  }
  #root { padding: 28px 36px; }
  .mock-btn {
    display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px;
    border: 1px solid rgba(0,0,0,.14); border-radius: 6px; background: #fff;
    color: #262626; font: inherit; font-size: 11px; font-weight: 560; cursor: pointer;
  }
  .mock-btn[data-variant="ghost"], .mock-btn[data-variant="ghost-muted"] { border-color: transparent; background: transparent; }
  .mock-btn:hover { background: rgba(0,0,0,.05); }
  .mock-icon { width: 12px; height: 12px; display: inline-block; border-radius: 3px; background: currentColor; opacity: .4; }
  .mock-spinner { width: 13px; height: 13px; border: 2px solid #ccc; border-top-color: #5a5fe0; border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .mock-input { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: #5c5c5c; }
  .mock-input input { height: 28px; padding: 0 9px; border: 1px solid rgba(0,0,0,.14); border-radius: 7px; font: inherit; font-size: 12px; background: #fff; outline: none; }
  .mock-menu { position: relative; }
  .mock-menu summary { list-style: none; width: 28px; height: 26px; display: grid; place-items: center; border: 1px solid rgba(0,0,0,.14); border-radius: 6px; cursor: pointer; background: #fff; }
  .mock-menu-body { position: absolute; right: 0; top: 30px; z-index: 20; min-width: 200px; background: #fff; border: 1px solid rgba(0,0,0,.12); border-radius: 9px; box-shadow: 0 8px 28px rgba(0,0,0,.16); padding: 6px; }
  .mock-menu-title { font-size: 10px; color: #8f8f8f; padding: 4px 8px 2px; }
  .mock-menu-item { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 6px 8px; border-radius: 6px; font: inherit; font-size: 12px; cursor: pointer; }
  .mock-menu-item:hover { background: rgba(0,0,0,.06); }
  .mock-dialog-frame { position: fixed; inset: 6% 12%; z-index: 50; background: #fff; border-radius: 12px; box-shadow: 0 24px 80px rgba(15,23,42,.3); display: flex; flex-direction: column; overflow: hidden; }
  .mock-dialog-head { padding: 14px 18px; font-size: 14px; font-weight: 650; border-bottom: 1px solid rgba(0,0,0,.08); }
  .mock-dialog-body { flex: 1; overflow: auto; padding: 16px 18px; }
  .mock-dialog-foot { padding: 10px 18px; border-top: 1px solid rgba(0,0,0,.08); }
</style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/main.tsx"></script>
</body>
</html>
